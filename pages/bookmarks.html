<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Bookmarks | StreamLine Daily</title>

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/x-icon"
    href="../favicon.ico"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="stylesheet" href="../css/animations.css" />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

</head>

<body>

  <!-- PROGRESS -->
  <div id="progressBar"></div>

<!-- =========================
NAVBAR
========================== -->
<header class="navbar">

  <!-- Logo -->
  <div class="logo">
    <img
      src="assets/images/logo.png"
      alt="StreamLine Daily Logo"
    />
  </div>

  <!-- Navigation -->
  <nav>

    <ul class="nav-links">

      <!-- MOBILE SEARCH -->
      <li class="mobile-search">

        <div class="search-box">

          <input
            type="text"
            id="searchInput"
            placeholder="Search news..."
          />

          <button id="searchBtn">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>

        </div>

      </li>

      <li>
        <a href="index.html">
          Home
        </a>
      </li>

      <li>
        <a
          href="#"
          data-category="technology"
          onclick="loadCategory('technology')"
        >
          Technology
        </a>
      </li>

      <li>
        <a
          href="#"
          data-category="sports"
          onclick="loadCategory('sports')"
        >
          Sports
        </a>
      </li>

      <li>
        <a
          href="#"
          data-category="business"
          onclick="loadCategory('business')"
        >
          Business
        </a>
      </li>

      <li>
        <a
          href="#"
          data-category="entertainment"
          onclick="loadCategory('entertainment')"
        >
          Entertainment
        </a>
      </li>

      <li>
        <a href="pages/category.html">
          Categories
        </a>
      </li>

      <li>
        <a href="pages/article.html">
          Article
        </a>
      </li>

      <li>
        <a href="pages/about.html">
          About
        </a>
      </li>

      <li>
        <a href="pages/history.html">
          History
        </a>
      </li>

    </ul>

  </nav>

  <!-- Right Controls -->
  <div class="nav-controls">

    <!-- Dark Mode -->
    <button id="themeToggle">
      <i class="fa-solid fa-moon"></i>
    </button>

    <!-- Burger Menu -->
    <div class="menu-toggle" id="menuToggle">
      <i class="fa-solid fa-bars"></i>
    </div>

  </div>

</header>

  <!-- HERO -->
  <section class="hero small-hero">

    <div class="hero-content">

      <h1>Saved Bookmarks</h1>

      <p>
        Access all the articles you saved for later reading.
      </p>

      <div class="live-time" id="liveTime"></div>

    </div>

  </section>

  <!-- ACTIONS -->
  <section class="bookmark-actions">

    <button id="clearBookmarks">

      <i class="fa-solid fa-trash"></i>

      Clear Bookmarks

    </button>

  </section>

  <!-- BOOKMARK CONTENT -->
  <main>

    <!-- BOOKMARK NEWS -->
    <section
      class="news-container"
      id="bookmarksContainer"
    >

    </section>

    <!-- EMPTY STATE -->
    <div
      class="empty-state"
      id="emptyBookmarks"
    >

      <i
        class="fa-regular fa-bookmark"
        style="
          font-size: 6rem;
          margin-bottom: 20px;
        "
      ></i>

      <h2>No Bookmarks Yet</h2>

      <p>
        Saved articles will appear here.
      </p>

      <a
        href="../index.html"
        class="read-btn"
        style="
          display: inline-block;
          margin-top: 20px;
          text-decoration: none;
        "
      >

        Browse News

      </a>

    </div>

  </main>

  <!-- BACK TO TOP -->
  <button id="backToTop">

    ↑

  </button>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- FOOTER -->
  <footer class="footer">

    <p>
      © 2026 StreamLine Daily.
      All rights reserved.
    </p>

  </footer>

  <!-- JS -->
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/bookmarks.js"></script>

</body>

</html>
